services:
  server:
    build: ./doomsday-server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
    restart: unless-stopped

  client:
    build:
      context: ./doomsday-client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped
